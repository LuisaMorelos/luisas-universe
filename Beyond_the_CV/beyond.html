<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beyond the CV | Luisa Morelos</title>

    <link rel="stylesheet" href="beyond.css">
</head>

<body>

    <main class="universe">

        <!-- ACTIVATION SCREEN -->

        <div class="activation-screen">

            <p class="system-text">
                SYSTEM INITIALIZING...
            </p>

            <p class="welcome-text">
                WELCOME, EXPLORER.
            </p>

        </div>


        <!-- BACKGROUND STARS -->

        <div class="stars stars-one"></div>
        <div class="stars stars-two"></div>
        <div class="stars stars-three"></div>


        <!-- MAIN CONTENT -->

        <section class="universe-content">

            <p class="universe-label">
                BEYOND THE CV
            </p>

            <h1>
                LUISA'S UNIVERSE
            </h1>

            <p class="universe-description">
                A little space beyond the résumé.
            </p>

            <p class="exploration-message">
                ✦ CHOOSE A DESTINATION TO EXPLORE ✦
            </p>


            <!-- COSMIC SYSTEM -->

            <div class="cosmic-system">

                <!-- LARGE CIRCLE -->

                <div class="main-ring"></div>


                <!-- PLANET -->

                <div class="planet">

                    <img
                        src="assets/planet.png"
                        alt="Planet"
                    >

                </div>


                <!-- DRAMAS -->

                <button class="destination destination-dramas">

                    <span class="icon-circle">

                        <img
                            src="assets/dramas.png"
                            alt="Dramas"
                        >

                    </span>

                    <span class="destination-label">
                        DRAMAS
                    </span>

                </button>


                <!-- BOOKS -->

                <button class="destination destination-books">

                    <span class="icon-circle">

                        <img
                            src="assets/books.png"
                            alt="Books"
                        >

                    </span>

                    <span class="destination-label">
                        BOOKS
                    </span>

                </button>


                <!-- CREATIVE -->

                <button class="destination destination-creative">

                    <span class="icon-circle">

                        <img
                            src="assets/creative.png"
                            alt="Creative"
                        >

                    </span>

                    <span class="destination-label">
                        CREATIVE
                    </span>

                </button>


                <!-- RANDOM THOUGHTS -->

                <button class="destination destination-thoughts">

                    <span class="icon-circle">

                        <img
                            src="assets/random-thoughts.png"
                            alt="Random Thoughts"
                        >

                    </span>

                    <span class="destination-label">
                        RANDOM THOUGHTS
                    </span>

                </button>


                <!-- TRAVEL -->

                <button class="destination destination-travel">

                    <span class="icon-circle">

                        <img
                            src="assets/travel.png"
                            alt="Travel"
                        >

                    </span>

                    <span class="destination-label">
                        TRAVEL
                    </span>

                </button>


                <!-- MUSIC -->

                <button class="destination destination-music">

                    <span class="icon-circle">

                        <img
                            src="assets/music.png"
                            alt="Music"
                        >

                    </span>

                    <span class="destination-label">
                        MUSIC
                    </span>

                </button>


                <!-- SMALL ORBIT DOTS -->

                <span class="orbit-dot dot-one"></span>
                <span class="orbit-dot dot-two"></span>
                <span class="orbit-dot dot-three"></span>
                <span class="orbit-dot dot-four"></span>
                <span class="orbit-dot dot-five"></span>
                <span class="orbit-dot dot-six"></span>

            </div>

        </section>

    </main>


    <script src="beyond.js"></script>

</body>

</html>
